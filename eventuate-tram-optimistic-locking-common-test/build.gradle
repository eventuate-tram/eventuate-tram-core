dependencies {
    api project(":eventuate-tram-consumer-common")
    api "io.eventuate.common.database:eventuate-common-jdbc:$eventuateCommonDatabaseVersion"
    api "jakarta.persistence:jakarta.persistence-api:$jakartaPersistenceVersion"
    
    api "io.micronaut:micronaut-core:$micronautVersion"
    api "io.micronaut:micronaut-inject:$micronautVersion"
    annotationProcessor "io.micronaut:micronaut-inject-java:$micronautVersion"

    implementation "org.junit.jupiter:junit-jupiter:$junitVersion"
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
